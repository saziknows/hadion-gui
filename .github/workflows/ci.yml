# Format, lint and test on every push and pull request, on Windows and Linux.
#
# Actions are pinned to full commit SHAs (verified against the tags on
# 2026-10-27 with `gh api repos/<action>/git/ref/tags/<tag>`).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - name: cargo fmt
        run: cargo fmt --all --check

  test:
    name: Clippy and tests (${{ matrix.os }})
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        # The keyring's Secret Service backend (D-Bus). rfd uses the XDG
        # desktop portal, so no GTK is needed.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Git identity for the fixture tests
        run: |
          git config --global user.name "gitvis CI"
          git config --global user.email "ci@example.invalid"
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
