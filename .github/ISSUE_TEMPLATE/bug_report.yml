name: Bug report
description: Something in Hadion does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste tokens, API keys or passwords** here: if one shows up
        somewhere it should not, describe where instead. Security problems go through the
        Security tab ("Report a vulnerability"), not an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with …
        2. Click …
  - type: textarea
    id: version
    attributes:
      label: Version and system
      description: Settings → About → "Copy details" puts the version, commit, build and OS on the clipboard.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Activity log, crash report or screenshot
      description: The activity log (Ctrl+L) shows every command Hadion ran. Crash reports are in Settings → Crash reports. Check them for anything private before you paste.
