name: Feature request
description: Something gitvis should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, and where gitvis gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Screenshots or sketches of other tools are welcome.
