# Test data for Hadion's own secret scanner. Every "secret" in these files is
# fake (made to match a provider's format so the scanner's rules can be
# tested), so GitHub's secret scanning should not raise alerts for them.
paths-ignore:
  - "crates/hadion-core/src/secrets.rs"
  - "crates/hadion-core/src/devops/ai/redact.rs"
  - "crates/hadion-core/tests/fixture_repo.rs"
  - "scripts/make-leaky-repo.sh"
