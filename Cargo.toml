[workspace]
resolver = "3"
members = ["crates/gitvis-core", "crates/gitvis"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
gitvis-core = { path = "crates/gitvis-core" }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
eframe = { version = "0.37", default-features = true, features = ["persistence"] }
egui = "0.37"
rfd = "0.17"
notify = "8"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug builds responsive: optimise dependencies (git2, egui) even in dev.
[profile.dev.package."*"]
opt-level = 2
